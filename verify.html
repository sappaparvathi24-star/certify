<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify certificate – Certifyx</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#070b14;color:#eef2ff;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.c{max-width:460px;width:100%;background:#0e1526;border:1px solid #1e2a4a;border-radius:20px;padding:30px;text-align:center}
.i{font-size:46px}.ok{color:#22c55e}.no{color:#f43f5e}dl{text-align:left;margin:20px 0 0}dt{color:#94a3c0;font-size:13px}dd{margin:0 0 12px;font-weight:600}small{color:#64748b}</style></head>
<body><div class="c" id="c"><p>Checking…</p></div><script src="config.js"></script><script>
(async()=>{const C=window.CX||{},id=new URLSearchParams(location.search).get('id')||'',el=document.getElementById('c'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 try{const base=C.fnBase||(C.url||'').replace(/\/$/,'')+'/functions/v1',r=await (await fetch(base+'/verify-certificate?id='+encodeURIComponent(id),{headers:{apikey:C.anon||''}})).json();
  el.innerHTML=r.valid?`<div class="i ok">✔</div><h2>Certificate verified</h2><p>This certificate was submitted and approved by the institution.</p><dl><dt>Student</dt><dd>${esc(r.student)}</dd><dt>Roll number</dt><dd>${esc(r.roll)}</dd><dt>Certificate</dt><dd>${esc(r.certificate)}</dd><dt>Submitted</dt><dd>${new Date(r.submitted).toLocaleDateString()}</dd></dl><small>Personal details are partly hidden to protect privacy.</small>`:`<div class="i no">✖</div><h2>Not verified</h2><p>${esc(r.reason||'We could not find an approved certificate for this link.')}</p>`;
 }catch(e){el.innerHTML='<div class="i no">!</div><h2>Could not check</h2><p>Try again later.</p>'}})();</script></body></html>
